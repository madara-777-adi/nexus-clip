    { name = "madara-777-adi", email = "aditya.upadh007@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.19.0",
    "fastapi>=0.141.1",
    "google-auth>=2.56.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
