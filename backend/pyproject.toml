[project]
name = "backend"
version = "0.1.0"
description = "Nexus Clip FastAPI Backend"
readme = "README.md"
authors = [
    { name = "madara-777-adi", email = "aditya.upadh007@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.19.0",
    "email-validator>=2.1.0",
    "fastapi>=0.141.1",
    "google-auth>=2.56.3",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "mypy>=2.3.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI uses Depends/Query/Header/File in argument defaults by design — not a bug
ignore = ["B008", "E501", "CPY001", "RUF022", "FAST001", "FAST002", "UP046", "LOG014"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests
